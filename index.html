<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>בחורי חב"ד</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Heebo', sans-serif; background-color: #f8fafc; }
        .married-row { background-color: #f0fdf4; opacity: 0.75; }
        .avatar-placeholder { background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); display: flex; align-items: center; justify-content: center; color: #64748b; }
        .list-enter { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo } = React;

        const FIREBASE_URL = 'FIREBASE_URL';//Database URL removed for security purposes.

        const normalizeDataStructure = (data) => {
            let flatList = [];
            if (Array.isArray(data)) {
                flatList = data.filter(Boolean);
            } else if (data && typeof data === 'object') {
                Object.keys(data).forEach(year => {
                    const yeshivas = data[year];
                    if (yeshivas && typeof yeshivas === 'object') {
                        Object.keys(yeshivas).forEach(yeshiva => {
                            const students = yeshivas[yeshiva];
                            if (Array.isArray(students)) {
                                students.forEach(name => {
                                    if (typeof name === 'string') {
                                        const cleanName = name.split('(')[0].trim();
                                        flatList.push({ name: cleanName, yeshiva, year });
                                    }
                                });
                            }
                        });
                    }
                });
            }

            return flatList.map(item => ({
                ...item,
                name: item.name || 'ללא שם',
                yeshiva: item.yeshiva || 'ללא ישיבה',
                year: (item.year || item.kvutze || 'לא ידוע').trim()
            }));
        };

        const StudentModal = ({ student, yearForAdd, onClose, onSave }) => {
            const initialState = student ? { ...student } : {
                name: '', yeshiva: '', year: yearForAdd, image: '', age: '', shortDesc: '', notes: '', phone: ''
            };
            const [formData, setFormData] = useState(initialState);
            const isAddMode = !student;

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));

            const handleSubmit = () => {
                if (!formData.name || !formData.yeshiva) return alert('חובה למלא שם וישיבה');
                onSave(formData);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                        <div className="bg-slate-800 p-4 flex justify-between items-center text-white">
                            <h3 className="text-xl font-bold flex items-center gap-2">
                                <i className={`fas ${isAddMode ? 'fa-user-plus' : 'fa-user-edit'}`}></i>
                                {isAddMode ? `הוספת בחור לשכבת הגיל של קבוצה ${yearForAdd}` : `עריכה: ${student.name}`}
                            </h3>
                            <button onClick={onClose} className="hover:bg-white/20 rounded-full p-2"><i className="fas fa-times"></i></button>
                        </div>
                        <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                            <div className="grid grid-cols-1 gap-4">
                                <div><label className="text-sm font-bold text-gray-700">שם מלא <span className="text-red-500">*</span></label><input name="name" value={formData.name || ''} onChange={handleChange} className="w-full border rounded p-2 outline-none" /></div>
                                <div><label className="text-sm font-bold text-gray-700">ישיבה גדולה<span className="text-red-500">*</span></label><input name="yeshiva" value={formData.yeshiva || ''} onChange={handleChange} className="w-full border rounded p-2 outline-none" /></div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-sm font-bold text-gray-700">שנת קבוצה</label><input name="year" value={formData.year || ''} onChange={handleChange} className="w-full border rounded p-2 outline-none" /></div>
                                    <div><label className="text-sm font-bold text-gray-700">גיל</label><input type="number" name="age" value={formData.age || ''} onChange={handleChange} className="w-full border rounded p-2 outline-none" /></div>
                                </div>
                            </div>
                            <hr className="border-slate-100" />
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-sm font-bold text-gray-700">טלפון של איש קשר</label><input name="phone" value={formData.phone || ''} onChange={handleChange} className="w-full border rounded p-2 text-sm outline-none" /></div>
                                <div><label className="text-sm font-bold text-gray-700">תמונה (קישור)</label><input name="image" value={formData.image || ''} onChange={handleChange} className="w-full border rounded p-2 text-sm outline-none" /></div>
                            </div>
                            <div><label className="text-sm font-bold text-gray-700">הערות</label><textarea name="notes" value={formData.notes || ''} onChange={handleChange} rows="3" className="w-full border rounded p-2 text-sm outline-none"></textarea></div>
                        </div>
                        <div className="p-4 bg-gray-50 flex justify-end gap-3 border-t">
                            <button onClick={onClose} className="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded">ביטול</button>
                            <button onClick={handleSubmit} className="px-6 py-2 bg-slate-800 text-white font-bold rounded">שמור</button>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [students, setStudents] = useState([]);
            const [filterYear, setFilterYear] = useState('all');
            const [filterYeshiva, setFilterYeshiva] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [tab, setTab] = useState('single');
            const [editingStudent, setEditingStudent] = useState(null);
            const [addingToYear, setAddingToYear] = useState(null);
            const [expandedYears, setExpandedYears] = useState({});
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                const loadData = async () => {
                    try {
                        const response = await fetch(FIREBASE_URL);

                        if (!response.ok) {
                            throw new Error(`שגיאת רשת: ${response.status}`);
                        }

                        const data = await response.json();
                        if (!data) {
                            setStudents([]);
                            setIsLoading(false);
                            return;
                        }

                        const dataArray = Array.isArray(data) ? data.filter(Boolean) : [];
                        if (dataArray.length > 0 && dataArray[0].hasOwnProperty('currentStatus')) {
                            setStudents(dataArray);
                        } else {
                            const flatData = normalizeDataStructure(data);
                            const processed = flatData.map((s, index) => ({
                                id: index,
                                ...s,
                                currentStatus: s.currentStatus || 'single',
                                image: s.image || '',
                                age: s.age || '',
                                notes: s.notes || '',
                                phone: s.phone || ''
                            }));
                            setStudents(processed);

                            if (processed.length > 0) {
                                saveToFirebase(processed);
                            }
                        }
                    } catch (error) {
                        console.error(error);
                        alert("שגיאה בשליפת הנתונים. ודאו שהגישה ל-Firebase פתוחה לקריאה.");
                    } finally {
                        setIsLoading(false);
                    }
                };
                loadData();
            }, []);

            const saveToFirebase = async (dataArray) => {
                try {
                    await fetch(FIREBASE_URL, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dataArray)
                    });
                } catch (error) {
                    alert("שגיאת תקשורת בשמירת הנתונים בענן.");
                }
            };

            const handleSaveStudent = (updated) => {
                const newStudents = students.map(s => s.id === updated.id ? updated : s);
                setStudents(newStudents);
                saveToFirebase(newStudents);
                setEditingStudent(null);
            };

            const handleCreateStudent = (newStudentData) => {
                const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                const newStudent = { id: newId, ...newStudentData, currentStatus: 'single' };
                const newStudents = [...students, newStudent];
                setStudents(newStudents);
                saveToFirebase(newStudents);
                setAddingToYear(null);
            };

            const toggleStatus = (id, newStatus) => {
                const newStudents = students.map(s => s.id === id ? { ...s, currentStatus: newStatus } : s);
                setStudents(newStudents);
                saveToFirebase(newStudents);
            };

            const toggleYear = (year) => setExpandedYears(prev => ({ ...prev, [year]: !prev[year] }));

            const allYeshivas = useMemo(() => [...new Set(students.map(s => s.yeshiva).filter(Boolean))].sort(), [students]);
            const allYears = useMemo(() => [...new Set(students.map(s => s.year).filter(Boolean))].sort().reverse(), [students]);

            const filteredStudents = useMemo(() => {
                return students.filter(s => {
                    const matchesYear = filterYear === 'all' || s.year === filterYear;
                    const matchesYeshiva = filterYeshiva === 'all' || s.yeshiva === filterYeshiva;
                    const matchesSearch = (s.name && s.name.includes(searchTerm)) || (s.yeshiva && s.yeshiva.includes(searchTerm));
                    const matchesTab = tab === 'all' ? true : s.currentStatus === tab;
                    return matchesYear && matchesYeshiva && matchesSearch && matchesTab;
                });
            }, [students, filterYear, filterYeshiva, searchTerm, tab]);

            const groupedData = useMemo(() => {
                const groups = {};
                filteredStudents.forEach(student => {
                    const year = student.year || 'לא ידוע';
                    const yeshiva = student.yeshiva || 'ללא שם ישיבה';
                    if (!groups[year]) groups[year] = {};
                    if (!groups[year][yeshiva]) groups[year][yeshiva] = [];
                    groups[year][yeshiva].push(student);
                });
                return Object.keys(groups).sort().reverse().map(year => ({
                    year,
                    yeshivas: Object.keys(groups[year]).sort().map(yeshiva => ({
                        name: yeshiva,
                        students: groups[year][yeshiva]
                    }))
                }));
            }, [filteredStudents]);

            const stats = useMemo(() => {
                const total = students.length;
                const married = students.filter(s => s.currentStatus === 'married').length;
                return { total, married, single: total - married };
            }, [students]);

            if (isLoading) return <div className="min-h-screen flex items-center justify-center font-bold text-xl text-slate-700">מתחבר למסד הנתונים...</div>;

            return (
                <div className="min-h-screen pb-12 bg-slate-50">
                    {editingStudent && <StudentModal student={editingStudent} onClose={() => setEditingStudent(null)} onSave={handleSaveStudent} />}
                    {addingToYear && <StudentModal yearForAdd={addingToYear} onClose={() => setAddingToYear(null)} onSave={handleCreateStudent} />}

                    <div className="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <h1 className="text-xl font-bold">בחורי חב"ד | רשימה מתעדכנת</h1>
                        </div>
                        <div className="bg-slate-800 py-2 border-t border-slate-700">
                            <div className="max-w-7xl mx-auto px-4 flex gap-6 text-sm">
                                <span><span className="font-bold">{stats.single}</span> פנויים</span>
                                <span><span className="font-bold">{stats.married}</span> חתנים</span>
                            </div>
                        </div>
                    </div>

                    <main className="max-w-7xl mx-auto p-4 sm:p-6">
                        <div className="flex flex-col md:flex-row gap-4 mb-6">
                            <input type="text" placeholder="חיפוש לפי שם או ישיבה..." className="p-2 border rounded outline-none" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                            <select className="p-2 border rounded outline-none" value={filterYear} onChange={e => setFilterYear(e.target.value)}>
                                <option value="all">כל השנים</option>
                                {allYears.map(y => <option key={y} value={y}>{y}</option>)}
                            </select>
                            <select className="p-2 border rounded outline-none" value={filterYeshiva} onChange={e => setFilterYeshiva(e.target.value)}>
                                <option value="all">כל הישיבות</option>
                                {allYeshivas.map(y => <option key={y} value={y}>{y}</option>)}
                            </select>
                            <div className="flex bg-white rounded border p-1">
                                <button onClick={() => setTab('single')} className={`px-3 py-1 rounded ${tab === 'single' ? 'bg-slate-800 text-white' : ''}`}>פנויים</button>
                                <button onClick={() => setTab('married')} className={`px-3 py-1 rounded ${tab === 'married' ? 'bg-slate-800 text-white' : ''}`}>חתנים</button>
                                <button onClick={() => setTab('all')} className={`px-3 py-1 rounded ${tab === 'all' ? 'bg-slate-800 text-white' : ''}`}>הכל</button>
                            </div>
                        </div>

                        {groupedData.length === 0 ? (
                            <div className="text-center p-10 text-gray-500 bg-white rounded-xl shadow-sm border">לא נמצאו נתונים להצגה.</div>
                        ) : (
                            groupedData.map(group => (
                                <div key={group.year} className="mb-4 bg-white rounded-xl shadow-sm border p-4">
                                    <div className="cursor-pointer text-xl font-bold text-slate-800" onClick={() => toggleYear(group.year)}>
                                        קבוצה {group.year} <span className="text-sm text-slate-400">{expandedYears[group.year] ? '▲' : '▼'}</span>
                                    </div>
                                    {expandedYears[group.year] && (
                                        <div className="mt-4">
                                            {group.yeshivas.map(yg => (
                                                <div key={yg.name} className="mb-6">
                                                    <h3 className="font-bold mb-2 bg-slate-100 inline-block p-1 rounded px-3">{yg.name}</h3>
                                                    <div className="border rounded divide-y">
                                                        {yg.students.map(student => (
                                                            <div key={student.id} className={`p-3 flex justify-between items-center hover:bg-slate-50 ${student.currentStatus === 'married' ? 'married-row' : ''}`}>
                                                                <div>
                                                                    <span className="font-bold">{student.name}</span>
                                                                    {student.age && <span className="ml-3 text-sm bg-yellow-100 text-yellow-800 px-2 rounded">גיל: {student.age}</span>}
                                                                </div>
                                                                <div className="flex gap-2">
                                                                    <button onClick={() => setEditingStudent(student)} className="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm transition">ערוך</button>
                                                                    {student.currentStatus !== 'married' ?
                                                                        <button onClick={() => toggleStatus(student.id, 'married')} className="px-3 py-1 bg-green-100 hover:bg-green-200 text-green-800 rounded text-sm transition font-bold">סמן כחתן</button> :
                                                                        <button onClick={() => toggleStatus(student.id, 'single')} className="px-3 py-1 bg-red-100 hover:bg-red-200 text-red-800 rounded text-sm transition">החזר לפנויים</button>
                                                                    }
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                            <button onClick={() => setAddingToYear(group.year)} className="mt-4 text-blue-600 hover:text-blue-800 font-bold"><i className="fas fa-plus mr-1"></i> הוסף תלמיד לקבוצה {group.year}</button>
                                        </div>
                                    )}
                                </div>
                            ))
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
